name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            node_modules
            site/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'site/package-lock.json') }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: npm ci

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            site/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'site/package-lock.json') }}
      - run: npx tsc --noEmit

  validate:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            site/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'site/package-lock.json') }}
      - run: npx tsx scripts/validate-canon.ts 2>&1 | tee validate-output.txt
      - name: Check error count
        shell: bash
        run: |
          ERRORS=$(grep -c '^  ERROR' validate-output.txt || true)
          echo "Found $ERRORS error(s)"
          if [ "$ERRORS" -gt 5 ]; then
            echo "Too many errors ($ERRORS > 5) — failing"
            exit 1
          fi
          echo "Warning: $ERRORS error(s) found (threshold 5, not exceeded)"

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            site/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npx astro build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: aetherion-archive
          directory: site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
